[gcode_macro _ENSURE_XY]
gcode:
  {% if ("x" not in printer.toolhead.homed_axes) or ("y" not in printer.toolhead.homed_axes) %}
    G28 X Y
  {% endif %}

# =========================
# Pause / Resume / Cancel
# =========================
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_extrude: 1.0
variable_restore_temp: 0
variable_restore_abs_e: 0
variable_restore_e: 0.0
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set t_target = printer.extruder.target|float %}
  {% set abs_e = 1 if printer.gcode_move.absolute_extrude else 0 %}
  {% set epos = printer.gcode_move.gcode_position.e|float %}

  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_temp VALUE={t_target}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_abs_e VALUE={abs_e}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_e VALUE={epos}

  PAUSE_BASE

  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% if abs_e == 1 %} M83 {% endif %}
    G91
    G1 E-{E} F2100
    G90
    {% if abs_e == 1 %}
      M82
      G92 E{epos}
    {% endif %}
  {% endif %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set x_park = 1 %}
    {% set y_park = 244 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = 2.0 if act_z < (max_z - 2.0) else (max_z - act_z) %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set t = printer["gcode_macro PAUSE"].restore_temp|float %}
  {% set abs_e = printer["gcode_macro PAUSE"].restore_abs_e|int %}
  {% set epos = printer["gcode_macro PAUSE"].restore_e|float %}

  {% if t > 0 %}
    M109 S{t}
  {% endif %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% if abs_e == 1 %} M83 {% endif %}
    G91
    G1 E{E} F2100
    G90
    {% if abs_e == 1 %}
      M82
      G92 E{epos}
    {% endif %}
  {% else %}
    {action_raise_error("RESUME: extruder below min temp")}
  {% endif %}

  RESUME_BASE

[gcode_macro M0]
description: QIDI pause (maps to Klipper PAUSE)
gcode:
  PAUSE

[gcode_macro M601]
description: QidiSlicer "Pause print" (maps to Klipper PAUSE)
gcode:
  PAUSE

[gcode_macro M602]
description: QidiSlicer resume after M601 (maps to Klipper RESUME)
gcode:
  RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel print safely (motors off)
gcode:
  M118 CANCEL_PRINT: requested
  CLEAR_PAUSE
  TURN_OFF_HEATERS
  M107
  SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0.0

  {% if printer.virtual_sdcard.is_active|default(False) %}
    SDCARD_RESET_FILE
  {% endif %}

  {% if "z" in printer.toolhead.homed_axes %}
    G91
    G1 Z10 F600
    G90
  {% endif %}

  # optional park ONLY if XY homed
  {% if ("x" in printer.toolhead.homed_axes) and ("y" in printer.toolhead.homed_axes) %}
    G90
    G1 X30 Y30 F6000
  {% endif %}

  M84
  CANCEL_PRINT_BASE


# =========================
# QIDI chamber macros
# =========================
[gcode_macro M191]
gcode:
  {% set s = params.S|float %}
  {% if s == 0 %}
    M117 Chamber heating cancelled
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
    M140 S120
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={s-10} MAXIMUM={s+1}
    M117 Chamber at target temperature
  {% endif %}

[gcode_macro M141]
gcode:
  {% set s = params.S|float %}
  {% if s == 0 %}
    M117 Chamber heating cancelled
  {% else %}
    M117 Heating chamber (no wait)
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
  {% endif %}

[gcode_macro M8029]
gcode:
  {% if params.D is defined %}
    {% if (params.D|int)==1 %}
      ENABLE_FILAMENT_WIDTH_SENSOR
    {% endif %}
    {% if (params.D|int)==0 %}
      DISABLE_FILAMENT_WIDTH_SENSOR
    {% endif %}
  {% endif %}

[gcode_macro M900]
gcode:
  {% if params.K is defined %}
    SET_PRESSURE_ADVANCE ADVANCE={params.K}
  {% endif %}
  {% if params.T is defined %}
    SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
  {% endif %}

[gcode_macro M603]
description: Unload filament
gcode:
  M118 Heat up complete
  G92 E0
  G0 E15 F400
  G4 P1000
  G92 E0
  G1 E-90 F800
  M400
  M118 Filament unloaded

[gcode_macro M604]
description: Load filament
gcode:
  M118 Heat up complete
  M83
  G1 E80 F400
  M400
  M118 Filament loaded

[gcode_macro M303]
gcode:
  {% if params.E is defined and params.S is defined %}
    {% if (params.E|int)==-1 %}
      PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
    {% endif %}
    {% if (params.E|int)==0 %}
      PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
    {% endif %}
  {% endif %}


# =====================================================================
# KLICKY (QIDI Q1 Pro)
# - OPEN = probe on head (not pressed)
# - TRIGGERED = probe missing/docked/pressed
# =====================================================================
[gcode_macro KLICKY_CFG]
description: Klicky geometry and tuning
variable_dock_x: 96.7
variable_dock_y: 255
variable_approach_x: 96.7
variable_approach_y: 237
variable_pull_x: 72
variable_pull_y: 255
variable_clear_x: 72
variable_clear_y: 237
variable_push_x:     0.0
variable_push_y:     1.0
variable_dwell_ms:   250
variable_fallback_dx: 1.10
variable_fallback_dy: 2
variable_safe_z:     10.0
variable_travel_f:   6000
variable_dock_f:     6000
gcode:
  ; no-op

[gcode_macro _KLICKY_FORCE_LIFT]
description: Lift Z a bit before long XY moves
gcode:
  {% set cfg = printer["gcode_macro KLICKY_CFG"] %}
  {% if "z" in printer.toolhead.homed_axes %}
    {% set curz = printer.toolhead.position.z|float %}
    {% set safe = cfg.safe_z|float %}
    {% if curz < safe %}
      G91
      G1 Z{(safe-curz)|round(3)} F600
      G90
    {% endif %}
  {% endif %}

[gcode_macro _KLICKY_REFRESH_ENDSTOPS]
gcode:
  QUERY_ENDSTOPS

[gcode_macro _KLICKY_ASSERT_OPEN]
gcode:
  {% set z = (printer.query_endstops.last_query.z|default("unknown"))|string|lower %}
  {% if z in ["triggered","1","true"] %}
    {action_raise_error("KLICKY: probe TRIGGERED (missing/docked/pressed)")}
  {% endif %}

[gcode_macro _KLICKY_ASSERT_TRIG]
gcode:
  {% set z = (printer.query_endstops.last_query.z|default("unknown"))|string|lower %}
  {% if z in ["open","0","false"] %}
    {action_raise_error("KLICKY: expected TRIGGERED after docking, got OPEN")}
  {% endif %}

[gcode_macro _KLICKY_ATTACH_ATTEMPT_PRIMARY]
gcode:
  {% set c = printer["gcode_macro KLICKY_CFG"] %}
  G90
  G0 X{c.approach_x} Y{c.approach_y} F{c.travel_f}
  G0 X{c.dock_x}     Y{c.dock_y}     F{c.travel_f}
  {% if (c.push_x|float != 0.0) or (c.push_y|float != 0.0) %}
    G0 X{(c.dock_x + c.push_x)|round(3)} Y{(c.dock_y + c.push_y)|round(3)} F{c.dock_f}
  {% endif %}
  G4 P{c.dwell_ms}
  G0 X{c.approach_x} Y{c.approach_y} F{c.dock_f}
  M400
  G4 P120


[gcode_macro _KLICKY_DOCK_ATTEMPT]
gcode:
  {% set c = printer["gcode_macro KLICKY_CFG"] %}
  G90
  G0 X{c.approach_x} Y{c.approach_y} F{c.travel_f}
  G0 X{c.dock_x}     Y{c.dock_y}     F{c.travel_f}
  {% if (c.push_x|float != 0.0) or (c.push_y|float != 0.0) %}
    G0 X{(c.dock_x + c.push_x)|round(3)} Y{(c.dock_y + c.push_y)|round(3)} F{c.dock_f}
  {% endif %}
  G4 P{c.dwell_ms}
  G0 X{c.pull_x}     Y{c.pull_y}     F{c.dock_f}
  G4 P120
  G0 X{c.clear_x}    Y{c.clear_y}    F{c.dock_f}
  G0 X{c.approach_x} Y{c.approach_y} F{c.travel_f}
  M400
  G4 P120


[gcode_macro _KLICKY_ATTACH_ATTEMPT_FALLBACK]
gcode:
  {% set c = printer["gcode_macro KLICKY_CFG"] %}
  {% set dx = c.fallback_dx|float %}
  {% set dy = c.fallback_dy|float %}
  {% set xmax = printer.toolhead.axis_maximum.x|float %}
  {% set ymax = printer.toolhead.axis_maximum.y|float %}

  {% set ax = [c.approach_x+dx, xmax]|min %}
  {% set ay = [c.approach_y+dy, ymax]|min %}
  {% set dxp = [c.dock_x+dx, xmax]|min %}
  {% set dyp = [c.dock_y+dy, ymax]|min %}

  G90
  G0 X{ax|round(3)}  Y{ay|round(3)}  F{c.travel_f}
  G0 X{dxp|round(3)} Y{dyp|round(3)} F{c.travel_f}
  {% if (c.push_x|float != 0.0) or (c.push_y|float != 0.0) %}
    {% set px = [dxp + c.push_x|float, xmax]|min %}
    {% set py = [dyp + c.push_y|float, ymax]|min %}
    G0 X{px|round(3)} Y{py|round(3)} F{c.dock_f}
  {% endif %}
  G4 P{c.dwell_ms}
  G0 X{ax|round(3)} Y{ay|round(3)} F{c.dock_f}
  M400
  G4 P120

[gcode_macro _KLICKY_ATTACH_VERIFY]
gcode:
  {% set z = (printer.query_endstops.last_query.z|default("unknown"))|string|lower %}
  {% if z in ["open","0","false"] %}
    {action_respond_info("KLICKY_ATTACH done")}
  {% elif z in ["triggered","1","true"] %}
    {action_respond_info("KLICKY_ATTACH: still TRIGGERED, retry fallback")}
    _KLICKY_ATTACH_ATTEMPT_FALLBACK
    _KLICKY_REFRESH_ENDSTOPS
    _KLICKY_ASSERT_OPEN
    {action_respond_info("KLICKY_ATTACH done (fallback)")}
  {% else %}
    {action_raise_error("KLICKY_ATTACH: UNKNOWN state: " ~ z)}
  {% endif %}

[gcode_macro KLICKY_ATTACH]
gcode:
  _ENSURE_XY
  _KLICKY_FORCE_LIFT
  _KLICKY_ATTACH_ATTEMPT_PRIMARY
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_OPEN

[gcode_macro KLICKY_DOCK]
gcode:
  _ENSURE_XY
  _KLICKY_FORCE_LIFT
  _KLICKY_DOCK_ATTEMPT
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_TRIG

[gcode_macro _KLICKY_ATTACH_IF_NEEDED_DECIDE]
gcode:
  {% set z = (printer.query_endstops.last_query.z|default("unknown"))|string|lower %}
  {% if z in ["open","0","false"] %}
    {action_respond_info("KLICKY: already attached")}
  {% elif z in ["triggered","1","true"] %}
    {action_respond_info("KLICKY: missing -> attach")}
    KLICKY_ATTACH
    _KLICKY_REFRESH_ENDSTOPS
    _KLICKY_ASSERT_OPEN
  {% else %}
    {action_raise_error("KLICKY: UNKNOWN probe state: " ~ z)}
  {% endif %}

[gcode_macro KLICKY_ATTACH_IF_NEEDED]
description: Attach probe only if missing/docked
gcode:
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ATTACH_IF_NEEDED_DECIDE


# =====================================================================
# HOMING OVERRIDE (XYZ) - ONLY ENTRY POINT for G28 X Y
# =====================================================================
[gcode_macro _HOME_Z_KLICKY]
gcode:
  {action_respond_info("HOMING(Z): start")}
  G4 P300

  {% set probe_x = 122.5 %}
  {% set probe_y = 122.5 %}
  {% set xoff = printer.configfile.settings['probe'].x_offset|float %}
  {% set yoff = printer.configfile.settings['probe'].y_offset|float %}
  {% set zx = (probe_x - xoff) %}
  {% set zy = (probe_y - yoff) %}

  G91
  G1 Z2 F600
  G90

  {% if ("x" not in printer.toolhead.homed_axes) or ("y" not in printer.toolhead.homed_axes) %}
    G28 X Y
  {% endif %}

  KLICKY_ATTACH_IF_NEEDED
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_OPEN

  G0 X{zx} Y{zy} F12000
  G28 Z

  Z_TILT_ADJUST
  G0 X{zx} Y{zy} F12000
  G28 Z

  G91
  G1 Z2 F600
  G90
  {action_respond_info("HOMING(Z): done")}

[homing_override]
axes: z
set_position_z: 0
gcode:
  _ENSURE_XY
  {action_respond_info("HOMING(Z): start")}
  {% set probe_x = 122.5 %}
  {% set probe_y = 122.5 %}
  {% set xoff = printer.configfile.settings['probe'].x_offset|float %}
  {% set yoff = printer.configfile.settings['probe'].y_offset|float %}
  {% set zx = (probe_x - xoff) %}
  {% set zy = (probe_y - yoff) %}

  G91
  G1 Z2 F600
  G90

  KLICKY_ATTACH_IF_NEEDED
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_OPEN

  G0 X{zx} Y{zy} F12000
  G28 Z

  Z_TILT_ADJUST
  G0 X{zx} Y{zy} F12000
  G28 Z

  {action_respond_info("HOMING(Z): done")}
  
  G91
  G1 Z5 F600
  G90


# =========================
# Wrappers you asked about
# =========================
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _KLICKY_FORCE_LIFT
  KLICKY_ATTACH_IF_NEEDED
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_OPEN
  BED_MESH_CALIBRATE_BASE {rawparams}

[gcode_macro PROBE_CALIBRATE]
rename_existing: PROBE_CALIBRATE_BASE
description: Ensure XY homed + ensure Klicky attached + home Z, then run stock PROBE_CALIBRATE
gcode:
  # 1) Home XY if needed
  {% if ("x" not in printer.toolhead.homed_axes) or ("y" not in printer.toolhead.homed_axes) %}
    G28 X Y
  {% endif %}

  # 2) Make sure probe is attached (must be OPEN)
  KLICKY_ATTACH_IF_NEEDED
  _KLICKY_REFRESH_ENDSTOPS
  _KLICKY_ASSERT_OPEN

  # 3) Home Z (required by PROBE_CALIBRATE)
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}

  {action_respond_info("PROBE_CALIBRATE: когда появится 'manual Z probe' — ТОЛЬКО ТОГДА убери/докни Klicky руками, потом TESTZ, ACCEPT, затем SAVE_CONFIG.")}

  PROBE_CALIBRATE_BASE {rawparams}


[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALCULATE_BASE
gcode:
  {% if ("x" not in printer.toolhead.homed_axes) or ("y" not in printer.toolhead.homed_axes) %}
    G28 X Y
  {% endif %}
  SCREWS_TILT_CALCULATE_BASE {rawparams}


# =========================
# Helpers
# =========================
[gcode_macro LOG_Z]
description: Print current Z position and configured probe z_offset
gcode:
  {% set zpos = printer.toolhead.position.z|float %}
  {% set zoff = printer.configfile.settings['probe'].z_offset|default(0.0)|float %}
  {action_respond_info("Zpos=%.3f z_offset=%.3f" % (zpos, zoff))}


# =========================
# Print start / end
# =========================
[gcode_macro PRINT_START]
gcode:
  {% set bed = params.BED_TEMP|default(60)|float %}
  {% set hotend = params.EXTRUDER_TEMP|default(200)|float %}
  {% set do_mesh = params.MESH|default(1)|int %}
  {% set hotend_hold = params.HOTEND_HOLD|default(150)|float %}
  {% set chamber = params.CHAMBER_TEMP|default(0)|float %}

  M107
  M140 S{bed}
  M104 S{hotend_hold}
  {% if chamber > 0 %} SET_HEATER_TEMPERATURE HEATER=chamber TARGET={chamber} {% endif %}
  M190 S{bed}

  G28 Z

  {% if do_mesh == 1 %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
  {% endif %}

  KLICKY_DOCK

  M104 S{hotend}
  G91
  G1 Z15 F600
  G90
  G0 X123 Y5 F6000
  M109 S{hotend}

[gcode_macro PRINT_END]
description: End print (park, cool, pickup probe)
gcode:
  M107
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z10 F600
    G90
    G1 X30 Y30 F6000
  {% endif %}
  TURN_OFF_HEATERS
  BED_MESH_CLEAR

  {% if ("x" in printer.toolhead.homed_axes) and ("y" in printer.toolhead.homed_axes) %}
    KLICKY_ATTACH_IF_NEEDED
  {% endif %}

  {action_respond_info("PRINT_END complete")}


# =====================================================================
# TIMELAPSE (your block untouched)
# =====================================================================
[gcode_macro GET_TIMELAPSE_SETUP]
description: Print the Timelapse setup
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set output_txt = ["Timelapse Setup:"] %}
  {% set _dummy = output_txt.append("enable: %s" % tl.enable) %}
  {% set _dummy = output_txt.append("park: %s" % tl.park.enable) %}
  {% if tl.park.enable %}
    {% set _dummy = output_txt.append("park position: %s time: %s s" % (tl.park.pos, tl.park.time)) %}
    {% set _dummy = output_txt.append("park cord x:%s y:%s dz:%s" % (tl.park.coord.x, tl.park.coord.y, tl.park.coord.dz)) %}
    {% set _dummy = output_txt.append("travel speed: %s mm/s" % tl.speed.travel) %}
  {% endif %}
  {% set _dummy = output_txt.append("fw_retract: %s" % tl.extruder.fw_retract) %}
  {% if not tl.extruder.fw_retract %}
    {% set _dummy = output_txt.append("retract: %s mm speed: %s mm/s" % (tl.extruder.retract, tl.speed.retract)) %}
    {% set _dummy = output_txt.append("extrude: %s mm speed: %s mm/s" % (tl.extruder.extrude, tl.speed.extrude)) %}
  {% endif %}
  {% set _dummy = output_txt.append("verbose: %s" % tl.verbose) %}
  {action_respond_info(output_txt|join("\n"))}

[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Take Timelapse shoot
variable_enable: False
variable_takingframe: False
variable_park: {'enable': False,
                'pos'   : 'center',
                'time'  : 0.1,
                'custom': {'x': 0, 'y': 0, 'dz': 0},
                'coord' : {'x': 0, 'y': 0, 'dz': 0}}
variable_extruder: {'fw_retract': False,
                    'retract': 1.0,
                    'extrude': 1.0}
variable_speed: {'travel': 100,
                 'retract': 15,
                 'extrude': 15}
variable_verbose: True
variable_check_time: 0.5
variable_restore: {'absolute': {'coordinates': True, 'extrude': True}, 'speed': 1500, 'e':0, 'factor': {'speed': 1.0, 'extrude': 1.0}}
variable_macro: {'pause': 'PAUSE', 'resume': 'RESUME'}
variable_is_paused: False
gcode:
  {% set hyperlapse = True if params.HYPERLAPSE and params.HYPERLAPSE|lower =='true' else False %}
  {% if enable %}
    {% if (hyperlapse and printer['gcode_macro HYPERLAPSE'].run) or
          (not hyperlapse and not printer['gcode_macro HYPERLAPSE'].run) %}
      {% if park.enable %}
        {% set pos = {'x': 'X' + park.coord.x|string if park.pos != 'y_only' else '',
                      'y': 'Y' + park.coord.y|string if park.pos != 'x_only' else '',
                      'z': 'Z'+ [printer.gcode_move.gcode_position.z + park.coord.dz, printer.toolhead.axis_maximum.z]|min|string} %}
        {% set restore = {'absolute': {'coordinates': printer.gcode_move.absolute_coordinates,
                                       'extrude'    : printer.gcode_move.absolute_extrude},
                          'speed'   : printer.gcode_move.speed,
                          'e'       : printer.gcode_move.gcode_position.e,
                          'factor'  : {'speed'  : printer.gcode_move.speed_factor,
                                       'extrude': printer.gcode_move.extrude_factor}} %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=restore VALUE="{restore}"
        {% if not printer[printer.toolhead.extruder].can_extrude %}
          {% if verbose %}{action_respond_info("Timelapse: Warning, minimum extruder temperature not reached!")}{% endif %}
        {% else %}
          {% if extruder.fw_retract %}
            G10
          {% else %}
            M83
            G0 E-{extruder.retract} F{speed.retract * 60}
          {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=True
        {macro.pause}
        SET_GCODE_OFFSET X=0 Y=0
        G90
        {% if "xyz" not in printer.toolhead.homed_axes %}
          {% if verbose %}{action_respond_info("Timelapse: Warning, axis not homed yet!")}{% endif %}
        {% else %}
          G0 {pos.x} {pos.y} {pos.z} F{speed.travel * 60}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=True
        UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={check_time}
        M400
      {% endif %}
      _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}
    {% endif %}
  {% else %}
    {% if verbose %}{action_respond_info("Timelapse: disabled, take frame ignored")}{% endif %}
  {% endif %}

[gcode_macro _TIMELAPSE_NEW_FRAME]
description: action call for timelapse shoot. must be a seperate macro
gcode:
 {action_call_remote_method("timelapse_newframe",
                            macropark=printer['gcode_macro TIMELAPSE_TAKE_FRAME'].park,
                            hyperlapse=params.HYPERLAPSE)}

[delayed_gcode _WAIT_TIMELAPSE_TAKE_FRAME]
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set factor = {'speed': printer.gcode_move.speed_factor, 'extrude': printer.gcode_move.extrude_factor} %}
  {% if tl.takingframe %}
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={tl.check_time}
  {% else %}
    {tl.macro.resume} VELOCITY={tl.speed.travel}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    {% if not printer[printer.toolhead.extruder].can_extrude %}
        {action_respond_info("Timelapse: Warning minimum extruder temperature not reached!")}
    {% else %}
      {% if tl.extruder.fw_retract %}
        G11
      {% else %}
        G0 E{tl.extruder.extrude} F{tl.speed.extrude * 60}
        G0 F{tl.restore.speed}
        {% if tl.restore.absolute.extrude %}
          M82
          G92 E{tl.restore.e}
        {% endif %}
      {% endif %}
    {% endif %}
    {% if tl.restore.factor.speed   != factor.speed   %} M220 S{(factor.speed*100)|round(0)}   {% endif %}
    {% if tl.restore.factor.extrude != factor.extrude %} M221 S{(factor.extrude*100)|round(0)} {% endif %}
    {% if not tl.restore.absolute.coordinates %} G91 {% endif %}
  {% endif %}

[delayed_gcode _HYPERLAPSE_LOOP]
gcode:
  UPDATE_DELAYED_GCODE ID=_HYPERLAPSE_LOOP DURATION={printer["gcode_macro HYPERLAPSE"].cycle}
  TIMELAPSE_TAKE_FRAME HYPERLAPSE=True

[gcode_macro TIMELAPSE_RENDER]
description: Render Timelapse video and wait for the result
variable_render: False
variable_run_identifier: 0
gcode:
  {action_respond_info("Timelapse: Rendering started")}
  {action_call_remote_method("timelapse_render", byrendermacro="True")}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_RENDER VARIABLE=render VALUE=True
  {printer.configfile.settings['gcode_macro pause'].rename_existing}
  UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_RENDER DURATION=0.5

[delayed_gcode _WAIT_TIMELAPSE_RENDER]
gcode:
  {% set ri = printer['gcode_macro TIMELAPSE_RENDER'].run_identifier % 4 %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_RENDER VARIABLE=run_identifier VALUE={ri + 1}
  {% if printer['gcode_macro TIMELAPSE_RENDER'].render %}
    M117 Rendering {['-','\\','|','/'][ri]}
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_RENDER DURATION=0.5
  {% else %}
    {action_respond_info("Timelapse: Rendering finished")}
    M117
    {printer.configfile.settings['gcode_macro resume'].rename_existing}
  {% endif %}

[gcode_macro TEST_STREAM_DELAY]
description: Helper macro to find stream and park delay
gcode:
  {% set min = printer.toolhead.axis_minimum %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set act = printer.toolhead.position %}
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% if act.z > 5.0 %}
    G0 X{min.x + 5.0} F{tl.speed.travel|int * 60}
    G0 X{(max.x-min.x)/2}
    G4 P{tl.park.time|float * 1000}
    _TIMELAPSE_NEW_FRAME HYPERLAPSE=FALSE
    G0 X{max.x - 5.0}
  {% else %}
    {action_raise_error("Toolhead z %.3f to low. Please place head above z = 5.0" % act.z)}
  {% endif %}


